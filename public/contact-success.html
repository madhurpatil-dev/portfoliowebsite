<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141a18" />
    <meta name="robots" content="noindex" />
    <title>Message received - Madhur Patil</title>
    <style>
      :root {
        color-scheme: dark;
        background: #141a18;
        color: #f2f1eb;
        font:
          1rem/1.7 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      body {
        display: grid;
        min-height: 100svh;
        place-items: center;
        margin: 0;
        padding: 1.5rem;
      }
      main {
        width: min(100%, 38rem);
        padding: clamp(2rem, 7vw, 4rem);
        border: 1px solid #343e38;
        background: #1a211e;
      }
      p {
        color: #a0aaa1;
      }
      h1 {
        margin: 0;
        color: #b7dfc0;
        font:
          500 clamp(2.5rem, 8vw, 4.5rem)/1.05 Georgia,
          'Times New Roman',
          serif;
        letter-spacing: -0.04em;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        color: #b7dfc0;
        font-weight: 700;
        text-underline-offset: 0.25em;
      }
      a:focus-visible {
        outline: 3px solid #93c7ff;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>MESSAGE RECEIVED</p>
      <h1>Thanks for reaching out.</h1>
      <p>Your note has been sent. I will get back to you as soon as I can.</p>
      <a href="/">Return to the portfolio</a>
    </main>
  </body>
</html>
