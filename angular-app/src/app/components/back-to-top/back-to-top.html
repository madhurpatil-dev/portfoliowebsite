<button
  class="back-to-top"
  type="button"
  aria-label="Back to top"
  [attr.aria-hidden]="!visible()"
  [tabIndex]="visible() ? 0 : -1"
  [class.is-visible]="visible()"
  (click)="scrollToTop()"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 19V5m-7 7 7-7 7 7" />
  </svg>
</button>
