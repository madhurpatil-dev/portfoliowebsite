<section class="contact-section" id="contact" aria-labelledby="contact-title">
  <div class="contact-inner container" appReveal>
    <p class="eyebrow"><span>06</span> &nbsp; Get in touch</p>
    <div class="contact-grid">
      <h2 id="contact-title">Have a good<br />problem to solve?</h2>
      <div class="contact-details">
        <p>
          I’m always happy to talk about backend engineering, interesting products, and teams
          building things that matter.
        </p>
        <a class="contact-email" href="mailto:madhurpatil.work@gmail.com">
          madhurpatil.work@gmail.com <span aria-hidden="true">↗</span>
        </a>
        <div class="contact-links">
          <a
            href="https://www.linkedin.com/in/madhurpatilofficial/"
            target="_blank"
            rel="noopener noreferrer"
          >
            LinkedIn <span aria-hidden="true">↗</span>
          </a>
        </div>
        <form
          class="contact-form"
          name="contact"
          method="POST"
          action="/contact-success.html"
          data-netlify="true"
          netlify-honeypot="bot-field"
        >
          <input type="hidden" name="form-name" value="contact" />
          <p class="contact-honeypot" aria-hidden="true">
            <label
              >Leave this field empty <input name="bot-field" tabindex="-1" autocomplete="off"
            /></label>
          </p>
          <div class="contact-form-field">
            <label for="contact-name">Name</label>
            <input id="contact-name" name="name" autocomplete="name" maxlength="120" required />
          </div>
          <div class="contact-form-field">
            <label for="contact-email">Email</label>
            <input
              id="contact-email"
              name="email"
              type="email"
              autocomplete="email"
              maxlength="254"
              required
            />
          </div>
          <div class="contact-form-field">
            <label for="contact-message">Message</label>
            <textarea
              id="contact-message"
              name="message"
              rows="5"
              maxlength="5000"
              required
            ></textarea>
          </div>
          <button class="contact-submit" type="submit">
            Send message <span aria-hidden="true">↗</span>
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
